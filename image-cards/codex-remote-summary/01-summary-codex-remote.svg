      <text x="143" y="270" text-anchor="middle" class="label ink">权限 / 工具</text>
    </g>
    <path d="M748 140 H839" class="line"/>
    <path d="M816 110 L852 140 L816 170" class="line"/>
    <g transform="translate(868 0)">
      <rect width="286" height="286" rx="34" fill="#F8D5C4" stroke="#1A1A1A" stroke-width="5"/>
      <text x="143" y="58" text-anchor="middle" font-size="34" font-weight="900" class="ink">Devbox / SSH</text>
      <path d="M76 128 H210 M92 96 H194 M92 160 H194" stroke="#1A1A1A" stroke-width="12" stroke-linecap="round"/>
      <text x="143" y="232" text-anchor="middle" class="label ink">Remote SSH GA</text>
      <text x="143" y="266" text-anchor="middle" class="label ink">远程项目也能跑</text>
    </g>
  </g>
  <g class="font" transform="translate(112 852)" filter="url(#shadow)">
    <g>
      <rect width="492" height="218" rx="30" fill="#FFFFFF" stroke="#1A1A1A" stroke-width="5"/>
      <circle cx="54" cy="55" r="26" fill="#F9E79F" stroke="#1A1A1A" stroke-width="4"/>
      <text x="54" y="67" font-size="28" font-weight="900" text-anchor="middle">1</text>
      <text x="96" y="65" class="body ink">能做什么</text>
      <text x="44" y="128" class="small ink">开始任务 / 审输出</text>
      <text x="44" y="174" class="small ink">改方向 / 批准下一步</text>
    </g>
    <g transform="translate(526 0)">
      <rect width="492" height="218" rx="30" fill="#FFFFFF" stroke="#1A1A1A" stroke-width="5"/>
      <circle cx="54" cy="55" r="26" fill="#D5C6E0" stroke="#1A1A1A" stroke-width="4"/>
      <text x="54" y="67" font-size="28" font-weight="900" text-anchor="middle">2</text>
      <text x="96" y="65" class="body ink">适合场景</text>
      <text x="44" y="128" class="small ink">长任务 / 测试修复</text>
      <text x="44" y="174" class="small ink">批量重构 / 远程 devbox</text>
    </g>
    <g transform="translate(0 252)">
      <rect width="492" height="218" rx="30" fill="#FFFFFF" stroke="#1A1A1A" stroke-width="5"/>
      <circle cx="54" cy="55" r="26" fill="#B5E5CF" stroke="#1A1A1A" stroke-width="4"/>
      <text x="54" y="67" font-size="28" font-weight="900" text-anchor="middle">3</text>
      <text x="96" y="65" class="body ink">安全边界</text>
      <text x="44" y="128" class="small ink">宿主机权限仍然生效</text>
      <text x="44" y="174" class="small ink">重要命令保留审批</text>
    </g>
    <g transform="translate(526 252)">
      <rect width="492" height="218" rx="30" fill="#FFFFFF" stroke="#1A1A1A" stroke-width="5"/>
      <circle cx="54" cy="55" r="26" fill="#F8D5C4" stroke="#1A1A1A" stroke-width="4"/>
      <text x="54" y="67" font-size="28" font-weight="900" text-anchor="middle">4</text>
      <text x="96" y="65" class="body ink">事实边界</text>
      <text x="44" y="128" class="small ink">iOS / Android 预览</text>
      <text x="44" y="174" class="small ink">Windows 宿主机即将支持</text>
    </g>
  </g>
  <g class="font" filter="url(#shadow)">
    <rect x="112" y="1370" width="1018" height="112" rx="30" fill="#D5C6E0" stroke="#1A1A1A" stroke-width="5"/>
    <text x="621" y="1439" font-size="40" font-weight="900" text-anchor="middle" class="ink">远程操作 = 线程状态 + 人类判断 + 宿主机执行</text>
    <rect x="172" y="1518" width="898" height="78" rx="28" fill="#F9E79F" stroke="#1A1A1A" stroke-width="5"/>
    <text x="621" y="1568" font-size="34" font-weight="900" text-anchor="middle" class="ink">先从低风险仓库试，再接入重流程</text>
  </g>
  <g opacity="0.7" class="thin">
