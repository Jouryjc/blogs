    <path d="M382 110 L418 140 L382 170" class="line"/>
    <g transform="translate(434 0)">
      <rect width="286" height="286" rx="34" fill="#B5E5CF" stroke="#1A1A1A" stroke-width="5"/>
      <text x="143" y="58" text-anchor="middle" font-size="34" font-weight="900" class="ink">Codex 宿主机</text>
