      <rect x="86" y="86" width="92" height="128" rx="20" fill="#FAFAFA" stroke="#1A1A1A" stroke-width="4"/>
      <circle cx="132" cy="197" r="5" fill="#1A1A1A"/>
      <text x="143" y="245" text-anchor="middle" class="label ink">看输出 / 批命令</text>
      <text x="143" y="276" text-anchor="middle" class="label ink">改方向</text>
    </g>
