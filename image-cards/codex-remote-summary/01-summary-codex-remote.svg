    <rect x="222" y="168" width="798" height="64" rx="28" fill="#F9E79F" stroke="#1A1A1A" stroke-width="4"/>
    <text x="621" y="212" font-size="34" font-weight="800" class="ink">手机接管开发环境，长任务继续跑</text>
  </g>
  <g filter="url(#shadow)" class="font">
    <rect x="112" y="278" width="1018" height="172" rx="34" fill="#FFFFFF" stroke="#1A1A1A" stroke-width="5"/>
    <text x="621" y="350" font-size="48" font-weight="900" text-anchor="middle" class="ink">不是手机写代码</text>
    <text x="621" y="405" font-size="40" font-weight="850" text-anchor="middle" fill="#0F4C81">是手机接管 agent 的关键决策点</text>
    <path d="M225 418 C326 438,426 436,512 424" stroke="#E8655A" stroke-width="8" stroke-linecap="round" opacity="0.55"/>
  </g>
