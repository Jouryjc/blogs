<svg xmlns="http://www.w3.org/2000/svg" width="1242" height="1660" viewBox="0 0 1242 1660">
  <defs>
    <filter id="shadow" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="7" stdDeviation="8" flood-color="#2C3E50" flood-opacity="0.12"/>
    </filter>
    <pattern id="paper" width="80" height="80" patternUnits="userSpaceOnUse">
      <rect width="80" height="80" fill="#F5F0E8"/>
      <circle cx="12" cy="18" r="1.1" fill="#e7decf" opacity="0.5"/>
      <circle cx="62" cy="44" r="1.2" fill="#e1d7c8" opacity="0.42"/>
      <circle cx="35" cy="70" r="0.9" fill="#ece2d2" opacity="0.55"/>
    </pattern>
    <style>
      .font { font-family: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", Arial, sans-serif; }
      .ink { fill: #1A1A1A; }
      .muted { fill: #6B6B6B; }
      .line { stroke: #1A1A1A; stroke-width: 5; stroke-linecap: round; stroke-linejoin: round; fill: none; }
      .thin { stroke: #1A1A1A; stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; fill: none; }
      .card { stroke: #1A1A1A; stroke-width: 5; fill: #FFFFFF; }
      .small { font-size: 32px; font-weight: 700; }
      .body { font-size: 34px; font-weight: 700; }
      .label { font-size: 28px; font-weight: 700; }
    </style>
  </defs>
  <rect width="1242" height="1660" fill="url(#paper)"/>
  <path d="M72 70 C55 320,58 620,70 870 C83 1150,64 1390,82 1580" class="thin" opacity="0.45"/>
  <path d="M1170 62 C1190 340,1160 600,1174 870 C1188 1130,1166 1362,1178 1586" class="thin" opacity="0.45"/>
  <g class="font" text-anchor="middle">
