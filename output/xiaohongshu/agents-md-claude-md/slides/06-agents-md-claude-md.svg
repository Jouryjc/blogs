  <text x="936" y="112" text-anchor="end" fill="#5f6f86" font-size="28" font-weight="800" font-family="SFMono-Regular, Menlo, monospace">06/08</text><g><rect x="86" y="150" width="238" height="54" rx="27" fill="#d9f0d1" stroke="#0b2545" stroke-width="5"/><text x="107" y="187" fill="#0b2545" font-size="28" font-weight="800" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, Arial, sans-serif">一个反直觉提醒</text></g><text x="86" y="295" text-anchor="start" fill="#0b2545" font-size="74" font-weight="900" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, Arial, sans-serif"><tspan x="86" dy="0">文件不是越厚越好</tspan></text><rect x="86" y="500" width="908" height="455" rx="40" fill="#fffdf8" stroke="#0b2545" stroke-width="8"/><circle cx="145" cy="590" r="18" fill="#ffbe73" stroke="#0b2545" stroke-width="5"/><text x="190" y="606" text-anchor="start" fill="#0b2545" font-size="42" font-weight="800" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, Arial, sans-serif"><tspan x="190" dy="0">短而准的规则是导航</tspan></text><circle cx="145" cy="686" r="18" fill="#d9f0d1" stroke="#0b2545" stroke-width="5"/><text x="190" y="702" text-anchor="start" fill="#0b2545" font-size="42" font-weight="800" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, Arial, sans-serif"><tspan x="190" dy="0">长而乱的规则是噪音</tspan></text><circle cx="145" cy="782" r="18" fill="#d8ecff" stroke="#0b2545" stroke-width="5"/><text x="190" y="798" text-anchor="start" fill="#0b2545" font-size="42" font-weight="800" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, Arial, sans-serif"><tspan x="190" dy="0">上下文是预算，不是仓库</tspan></text><rect x="126" y="945" width="828" height="185" rx="32" fill="#d8ecff" stroke="#0b2545" stroke-width="7"/><text x="540" y="1015" text-anchor="middle" fill="#0b2545" font-size="36" font-weight="800" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, Arial, sans-serif"><tspan x="540" dy="0">不要塞完整 API 文档、历史流水账</tspan><tspan x="540" dy="48.6">也不要写“写干净代码”