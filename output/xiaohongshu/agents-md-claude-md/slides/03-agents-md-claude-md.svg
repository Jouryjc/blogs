  <text x="936" y="112" text-anchor="end" fill="#5f6f86" font-size="28" font-weight="800" font-family="SFMono-Regular, Menlo, monospace">03/08</text><g><rect x="86" y="150" width="322" height="54" rx="27" fill="#d9f0d1" stroke="#0b2545" stroke-width="5"/><text x="107" y="187" fill="#0b2545" font-size="28" font-weight="800" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, Arial, sans-serif">初始化之后先做这一步</text></g><text x="86" y="295" text-anchor="start" fill="#0b2545" font-size="74" font-weight="900" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, Arial, sans-serif"><tspan x="86" dy="0">别急着开工</tspan><tspan x="86" dy="82.88000000000001">先验证规则是否生效</tspan></text><rect x="104" y="482" width="872" height="126" rx="34" fill="#fffdf8" stroke="#0b2545" stroke-width="7"/><circle cx="168" cy="545" r="35" fill="#d8ecff" stroke="#0b2545" stroke-width="6"/><text x="168" y="558" text-anchor="middle" fill="#0b2545" font-size="34" font-weight="900" font-family="Arial, sans-serif">1</text><text x="230" y="560" text-anchor="start" fill="#0b2545" font-size="36" font-weight="800" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, Arial, sans-serif"><tspan x="230" dy="0">生成或手写 AGENTS.md / CLAUDE.md</tspan></text><rect x="104" y="652" width="872" height="126" rx="34" fill="#fffdf8" stroke="#0b2545" stroke-width="7"/><circle cx="168" cy="715" r="35" fill="#d9f0d1" stroke="#0b2545" stroke-width="6"/><text x="168" y="728" text-anchor="middle" fill="#0b2545" font-size="34" font-weight="900" font-family="Arial, sans-serif">2</text><text x="230" y="730" text-anchor="start" fill="#0b2545" font-size="36" font-weight="800" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, Arial, sans-serif"><tspan x="230" dy="0">删掉空话、重复信息、代码里能推断的内容</tspan></text><rect x="104" y="822" width="872" height="126" rx="34" fill="#fffdf8" stroke="#0b2545" stroke-width="7"/><circle cx="168" cy="885" r="35" fill="#ffbe73" stroke="#0b2545" stroke-width="6"/><text x="168" y="898" text-anchor="middle" fill="#0b2545" font-size="34" font-weight="900" font-family="Arial, sans-serif">3</text><text x="230" y="900" text-anchor="start" fill="#0b2545" font-size="36" font-weight="800" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, Arial, sans-serif"><tspan x="230" dy="0">让 agent 复述它读到的规则</tspan></text><rect x="104" y="992" width="872" height="126" rx="34" fill="#fffdf8" stroke="#0b2545" stroke-width="7"/><circle cx="168" cy="1055" r="35" fill="#ff897d" stroke="#0b2545" stroke-width="6"/><text x="168" y="1068" text-anchor="middle" fill="#0b2545" font-size="34" font-weight="900" font-family="Arial, sans-serif">4</text><text x="230" y="1070" text-anchor="start" fill="#0b2545" font-size="36" font-weight="800" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, Arial, sans-serif"><tspan x="230" dy="0">跑一个小任务，看它是否会按规则收尾</tspan></text>
