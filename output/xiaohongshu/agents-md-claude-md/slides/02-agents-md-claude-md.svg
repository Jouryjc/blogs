  <text x="936" y="112" text-anchor="end" fill="#5f6f86" font-size="28" font-weight="800" font-family="SFMono-Regular, Menlo, monospace">02/08</text><g><rect x="86" y="150" width="154" height="54" rx="27" fill="#d9f0d1" stroke="#0b2545" stroke-width="5"/><text x="107" y="187" fill="#0b2545" font-size="28" font-weight="800" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, Arial, sans-serif">核心观点</text></g><text x="86" y="295" text-anchor="start" fill="#0b2545" font-size="74" font-weight="900" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, Arial, sans-serif"><tspan x="86" dy="0">它不是配置文件</tspan><tspan x="86" dy="82.88000000000001">而是工作契约</tspan></text><rect x="86" y="500" width="908" height="520" rx="40" fill="#fffdf8" stroke="#0b2545" stroke-width="8"/><circle cx="145" cy="590" r="18" fill="#ffbe73" stroke="#0b2545" stroke-width="5"/><text x="190" y="606" text-anchor="start" fill="#0b2545" font-size="42" font-weight="800" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, Arial, sans-serif"><tspan x="190" dy="0">第一次生成多少内容不重要</tspan></text><circle cx="145" cy="686" r="18" fill="#d9f0d1" stroke="#0b2545" stroke-width="5"/><text x="190" y="702" text-anchor="start" fill="#0b2545" font-size="42" font-weight="800" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, Arial, sans-serif"><tspan x="190" dy="0">重要的是每次 agent 猜错、漏测、乱改边界后</tspan></text><circle cx="145" cy="782" r="18" fill="#d8ecff" stroke="#0b2545" stroke-width="5"/><text x="190" y="798" text-anchor="start" fill="#0b2545" font-size="42" font-weight="800" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, Arial, sans-serif"><tspan x="190" dy="0">你能不能把纠正沉淀成下次会生效的规则</tspan></text><g><rect x="132" y="1190" width="154" height="54" rx="27" fill="#d8ecff" stroke="#0b2545" stroke-width="5"/><text x="153" y="1227" fill="#0b2545" font-size="28" font-weight="800" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, Arial, sans-serif">长期记忆</text></g><g><rect x="402" y="1190" width="154" height="54" rx="27" fill="#d9f0d1" stroke="#0b2545" stroke-width="5"/><text x="423" y="1227" fill="#0b2545" font-size="28" font-weight="800" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, Arial, sans-serif">团队约定</text></g><g><rect x="672" y="1190" width="154" height="54" rx="27" fill="#ffbe73" stroke="#0b2545" stroke-width="5"/><text x="693" y="1227" fill="#0b2545" font-size="28" font-weight="800" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, Arial, sans-serif">减少返工</text></g>
